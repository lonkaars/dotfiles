font_family JetBrains Mono
bold_font JetBrains Mono Bold
italic_font JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size 10

modify_font cell_height 120%

term xterm-256color
cursor_blink_interval 0
cursor_shape block
shell_integration disabled
resize_debounce_time 0 0
resize_in_steps yes
confirm_os_window_close 0
enable_audio_bell no
remember_window_position no
remember_window_size no
initial_window_width 80c
initial_window_height 25c
copy_on_select clipboard

placement_strategy top-left
window_margin_width 8

map command+option+s no_op
map command+t no_op
map command+enter no_op
map command+shift+d no_op
map command+shift+w no_op
map command+w close_os_window
map command+option+r no_op
map command+k no_op
map command+option+k no_op
map command+control+l no_op
map command+l no_op
map command+f no_op

map kitty_mod+t no_op
map kitty_mod+enter no_op
map kitty_mod+w no_op
map kitty_mod+q no_op
map kitty_mod+delete no_op
map kitty_mod+slash no_op

